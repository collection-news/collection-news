name: Sanity check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit, component and server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  browser:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile
            browser: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:browser:build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            .test-app/server.log
          include-hidden-files: true
          retention-days: 14

  testing:
    # Preserve the existing required check name without changing branch protection.
    name: Sanity check
    needs: [quality, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        run: |
          test '${{ needs.quality.result }}' = 'success'
          test '${{ needs.browser.result }}' = 'success'
